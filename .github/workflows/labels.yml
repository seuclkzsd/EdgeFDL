# Creates or updates the labels described in .github/labels.yml. It starts only by hand (Actions, Labels,
# Run workflow) and removes nothing. `python tools/dev/labels.py` prints the same commands locally.
# Actions are pinned to commit SHAs, their release tag in the comment.
name: Labels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Apply .github/labels.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m pip install pyyaml
          python tools/dev/labels.py --apply
